        stop-color: var(--color-base-content, var(--base-fallback)); 
      }
      .base-bottom { 
        stop-color: color-mix(in srgb, var(--color-base-content, var(--base-fallback)) 85%, black 30%);
      }
      .base { fill: url(#baseGradient); }
    </style>
