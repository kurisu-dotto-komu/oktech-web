<svg class="oktech-logo-round" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <style>
      :root {
        --accent-fallback: oklch(0.757 0.120 173.7)
        --base-fallback: oklch(23.574% 0.066 313.189)
        filter: drop-shadow(0 4px 12px rgb(0 0 0 / 0.25));
      }
      svg { 
        filter: drop-shadow(0 4px 12px rgb(0 0 0 / 0.25));
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --accent-fallback: oklch(77.48% 0.204 60.62)
          --base-fallback: oklch(84.955% 0 0)
        }
      }
      .accent-top {
        stop-color: color-mix(in srgb, var(--color-primary, var(--accent-fallback)) 85%, white 30%); 
      }
      .accent-middle { 
        stop-color: var(--color-primary, var(--accent-fallback)); 
      }
      .accent-bottom { 
        stop-color: color-mix(in srgb, var(--color-primary, var(--accent-fallback)) 85%, black 30%);
      }
      .accent { fill: url(#accentGradient); }

      .base-top {
        stop-color: color-mix(in srgb, var(--color-base-content, var(--base-fallback)) 85%, white 30%); 
      }
      .base-middle { 
        stop-color: var(--color-base-content, var(--base-fallback)); 
      }
      .base-bottom { 
        stop-color: color-mix(in srgb, var(--color-base-content, var(--base-fallback)) 85%, black 30%);
      }
      .base { fill: url(#baseGradient); }
      .rotating { 
          transform-origin: center;
          animation: rotate 25s linear infinite;
      }
      @keyframes rotate {
          from { transform: rotate(0deg); }
          to { transform: rotate(360deg); }
      }
    </style>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop class="accent-top" offset="0%" style="stop-opacity: 1;" />
      <stop class="accent-middle" offset="50%" style="stop-opacity: 1;" />
      <stop class="accent-bottom" offset="100%" style="stop-opacity: 1;" />
    </linearGradient>
    <linearGradient id="baseGradient" x1="0%" y1="0%" x2="0%" y2="100%" >
      <stop class="base-top" offset="0%" style="stop-opacity: 1;" />
      <stop class="base-middle" offset="50%" style="stop-opacity: 1;" />
      <stop class="base-bottom" offset="100%" style="stop-opacity: 1;" />
    </linearGradient>
